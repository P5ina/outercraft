name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build OuterCraft.csproj -c Release -p:OutputPath=$GITHUB_WORKSPACE/build/

      - name: Package
        run: |
          mkdir -p dist/P5INA.OuterCraft
          cp build/OuterCraft.dll manifest.json default-config.json bundle/outercraft.shaders README.md LICENSE dist/P5INA.OuterCraft/
          cd dist && zip -r ../P5INA.OuterCraft.zip P5INA.OuterCraft

      - uses: actions/upload-artifact@v4
        with:
          name: P5INA.OuterCraft
          path: P5INA.OuterCraft.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: P5INA.OuterCraft.zip
          generate_release_notes: true
