name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build OuterCraft.csproj -c Release -p:OutputPath=$GITHUB_WORKSPACE/build/

      - name: Package
        run: |
          mkdir -p dist/P5INA.OuterCraft
          cp build/OuterCraft.dll manifest.json default-config.json bundle/outercraft.shaders README.md LICENSE dist/P5INA.OuterCraft/
          cd dist && zip -r ../P5INA.OuterCraft.zip P5INA.OuterCraft

      - uses: actions/upload-artifact@v4
        with:
          name: P5INA.OuterCraft
          path: P5INA.OuterCraft.zip

      # A release for every new version in manifest.json pushed to main (the tag is created here).
      - name: Version
        id: version
        run: |
          v=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          echo "tag=v$v" >> $GITHUB_OUTPUT
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi

      - name: Release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && steps.version.outputs.exists == 'false'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          name: OuterCraft ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          files: P5INA.OuterCraft.zip
          generate_release_notes: true
